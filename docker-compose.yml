services:
  backend:
    build: ./backend
    container_name: sap-agent-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./templates:/app/templates  # WICHTIG: Templates einbinden
      - ./data:/app/data 
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sap-agent-frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
