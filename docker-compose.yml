services:
  backend:
    build: ./backend
    container_name: sap-agent-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./templates:/app/templates
      - ./data:/app/data
    # Sicherstellen, dass data-Verzeichnis existiert:
    command: >
      sh -c "mkdir -p /app/data && python main_v2.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sap-agent-frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - API_URL=http://backend:8000
    restart: unless-stopped