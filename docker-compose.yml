services:
  backend:
    build: ./backend
    container_name: sap-agent-backend-v3
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./templates:/app/templates
      - ./data:/app/data
      - ./backend/parsers:/app/parsers
      - ./backend/utils:/app/utils
      - ./backend/tfvars:/app/tfvars
      - ./backend/config.yaml:/app/config.yaml
    # V3 Backend starten
    command: >
      sh -c "mkdir -p /app/data && python main_v3.py"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-react
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: sap-agent-frontend-v3
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped