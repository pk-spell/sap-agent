#     validation:
#       provider: "claude"        # Präzise
#       model: "claude-3-5-sonnet-20241022"
#       api_key: "${CLAUDE_API_KEY}"
#     generation:
#       provider: "openai"        # Beste Qualität
#       model: "gpt-4-turbo"
#       api_key: "${OPENAI_API_KEY}"

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8000
  reload: true  # Auto-reload in development

# Database
database:
  type: "sqlite"
  path: "data/chat_history.db"

# CORS (für React Frontend)
cors:
  origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allow_methods: ["*"]
  allow_headers: ["*"]
