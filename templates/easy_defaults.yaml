# SAP Deployment Automation Framework - Default Configuration
# These values provide sensible defaults for single-instance SAP deployments
# Based on official SDAF examples from Azure/sap-automation-samples

#########################################################################################
#  Environment/Application defaults                                                     #
#########################################################################################

# Default environment (DEV, QA, PRD, etc.)
environment: "DEV"

# Default Azure region
location: "westeurope"

# Network logical name (used in naming convention)
network_logical_name: "SAP01"

#########################################################################################
#  SAP System defaults                                                                  #
#########################################################################################

# Default SAP SID (will be replaced by user input)
sid: "X00"

# Default Database SID
database_sid: "HDB"

# Default database platform (HANA, DB2, ORACLE, ASE, SQLSERVER, NONE)
database_platform: "HANA"

# System description
description: "SAP System deployed via SDAF Assistant"

#########################################################################################
#  Deployment parameters                                                                #
#########################################################################################

# Use secondary IPs for virtual hostname support
use_secondary_ips: true

# Use scale sets for deployment
use_scalesets_for_deployment: false

# Use premium v2 storage for database
database_use_premium_v2_storage: false

# Upgrade packages after installation
upgrade_packages: false

#########################################################################################
#  Database tier defaults (Single Instance)                                             #
#########################################################################################

# Number of database servers (1 for single instance)
database_server_count: 1

# High availability for database (false for single instance)
database_high_availability: false

# Database VM size - Common options:
# Demo/Dev: E20ds_v4 (160GB RAM)
# Small: E32ds_v4 (256GB RAM)
# Medium: E64ds_v4 (512GB RAM)
# Large: M64ls (512GB RAM, M-series)
# XLarge: M128s (2TB RAM)
database_size: "E20ds_v4"

# Use DHCP for database VMs
database_vm_use_dhcp: true

# Database VM availability zones
database_vm_zones: '["1"]'

# Use proximity placement group for database
database_use_ppg: true

# Use availability set for database
database_use_avset: false

#########################################################################################
#  Application tier defaults (Disabled for Single Instance)                             #
#########################################################################################

# App tier sizing key
app_tier_sizing_dictionary_key: "Optimized"

# Enable application tier deployment (false for single instance)
enable_app_tier_deployment: false

# Use DHCP for app tier
app_tier_use_dhcp: true

#########################################################################################
#  SAP Central Services defaults (Disabled for Single Instance)                         #
#########################################################################################

# SCS server count (0 for single instance)
scs_server_count: 0

# SCS high availability
scs_high_availability: false

# Instance numbers
scs_instance_number: "01"
ers_instance_number: "02"
pas_instance_number: "00"

# SCS zones
scs_server_zones: '["1"]'

# SCS proximity placement group
scs_server_use_ppg: true

# SCS availability set
scs_server_use_avset: false

#########################################################################################
#  Application Servers defaults (Disabled for Single Instance)                          #
#########################################################################################

# Application server count (0 for single instance)
application_server_count: 0

# Application server zones
application_server_zones: '["1"]'

# Dual NICs for app tier
app_tier_dual_nics: false

# App server proximity placement group
application_server_use_ppg: true

# App server availability set
application_server_use_avset: true

#########################################################################################
#  Web Dispatcher defaults (Disabled for Single Instance)                               #
#########################################################################################

# Web dispatcher count (0 for single instance)
webdispatcher_server_count: 0

# Web dispatcher SID
web_sid: "W00"

# Web instance number
web_instance_number: "00"

# Web dispatcher zones
webdispatcher_server_zones: '["1"]'

# Web dispatcher proximity placement group
webdispatcher_server_use_ppg: false

# Web dispatcher availability set
webdispatcher_server_use_avset: false

#########################################################################################
#  OS Image defaults                                                                    #
#########################################################################################

# Operating system type
os_type: "LINUX"

# OS Publisher (SUSE or RedHat)
os_publisher: "SUSE"

# OS Offer (sles-sap-15-sp5, RHEL-SAP-HA, etc.)
os_offer: "sles-sap-15-sp5"

# OS SKU
os_sku: "gen2"

#########################################################################################
#  Common VM settings                                                                   #
#########################################################################################

# Deploy monitoring extension
deploy_monitoring_extension: false

# Deploy defender extension
deploy_defender_extension: false

# Patch mode
patch_mode: "ImageDefault"

# Patch assessment mode
patch_assessment_mode: "ImageDefault"

#########################################################################################
#  Cluster settings (for HA deployments)                                                #
#########################################################################################

# SCS cluster type (AFA, ASD, ISCSI)
scs_cluster_type: "AFA"

# Database cluster type (AFA, ASD, ISCSI)
database_cluster_type: "AFA"

# Use MSI for clusters
use_msi_for_clusters: true

# Use simple mount (SLES 15 SP3+)
use_simple_mount: false

# Use fence_kdump
use_fence_kdump: false

#########################################################################################
#  NFS settings                                                                         #
#########################################################################################

# NFS Provider (AFS, ANF, NFS, NONE)
# AFS = Azure Files for NFS (recommended for single instance)
# ANF = Azure NetApp Files (for larger deployments)
nfs_provider: "AFS"

# sapmnt volume size in GB
sapmnt_volume_size: 128

# Random ID for storage accounts
use_random_id_for_storageaccounts: true

#########################################################################################
#  Network settings                                                                     #
#########################################################################################

# Network type (greenfield or brownfield)
network_type: "greenfield"

# Use load balancers for standalone deployments
use_loadbalancers_for_standalone_deployments: true

# Use private endpoints
use_private_endpoint: true

# NSG/ASG with VNet
nsg_asg_with_vnet: false

# Greenfield subnet defaults
admin_subnet: "10.1.0.0/24"
db_subnet: "10.1.1.0/24"
app_subnet: "10.1.2.0/24"
web_subnet: "10.1.3.0/24"

#########################################################################################
#  Key Vault settings                                                                   #
#########################################################################################

# Enable purge control
enable_purge_control_for_keyvaults: false

#########################################################################################
#  Proximity Placement Group                                                            #
#########################################################################################

# Use PPG for app tier
use_app_proximityplacementgroups: false

#########################################################################################
#  Deployment type indicator                                                            #
#########################################################################################

deployment_type: "Single Instance (Standard)"
