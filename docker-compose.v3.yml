# Docker Compose - SAP Deployment Assistant V3
# Läuft alles lokal mit Ollama auf dem Host

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sap-agent-backend-v3
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./templates:/app/templates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sap-agent-frontend-v3
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend-react/src:/app/src
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  node_modules:
